services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aring-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Configura CLOUDFLARE_TUNNEL_TOKEN en .env}
    depends_on:
      - frontend
